# Builds the WaveR pacman package with a real Arch toolchain and publishes
# a self-hosted pacman repository on the gh-pages branch.
#
# Automatic mode (schedule): every 6 hours the check job compares the
# latest PUBLISHED WaveR release with the version marker on gh-pages
# (latest); it publishes only on change. Draft releases are ignored by
# the API. Like the Scoop bucket auto-update: scheduled workflows in a
# public repo get disabled after 60 days of no repo activity - re-enable
# them from Actions -> pacman-repo if that ever happens.
#
# Manual mode (workflow_dispatch): leave "version" empty to publish the
# latest release, or set it (with or without leading "v") to force a
# rebuild of a specific version:
#   gh workflow run pacman-repo.yml -f version=2.0.0
#
# What lands on gh-pages (Pages URL = https://franorde.github.io/pacman-repo/):
#   x86_64/wave-r.db                               database (pacman fetches <repo>.db)
#   x86_64/wave-r.db.tar.gz                        same database, name kept by repo-add
#   x86_64/wave-r-<ver>-<rel>-x86_64.pkg.tar.zst   the package
#   latest                                         published version marker (for the check)
#   index.html                                     tiny landing page (root would 404)
#
# Design: the repository contains ONLY the latest release; every publish
# rebuilds the database from scratch (no state carried over). Older
# versions stay available as WaveR release assets.

name: pacman-repo

on:
  workflow_dispatch:
    inputs:
      version:
        description: WaveR version to publish (empty = latest published release)
        required: false
        type: string
  schedule:
    # every 6 hours, like the Scoop bucket auto-update
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: pacman-repo
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.decide.outputs.version }}
      should: ${{ steps.decide.outputs.should }}
    steps:
      - name: Compare the latest WaveR release with the published repo
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_VERSION" ]; then
            # manual run with an explicit version: always publish
            echo "version=${INPUT_VERSION#v}" >> "$GITHUB_OUTPUT"
            echo "should=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # latest PUBLISHED release (the API ignores drafts)
          LATEST="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/FRANORDE/WaveR/releases/latest" \
            | grep -o '"tag_name": *"[^"]*"' | head -1 | cut -d'"' -f4)"
          LATEST="${LATEST#v}"
          echo "latest WaveR release: ${LATEST}"
          PUBLISHED="$(curl -fsSL \
            "https://franorde.github.io/pacman-repo/latest" || true)"
          echo "currently published: ${PUBLISHED:-none}"
          if [ "$PUBLISHED" = "$LATEST" ]; then
            echo "nothing to do"
            echo "should=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish needed"
            echo "should=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$LATEST" >> "$GITHUB_OUTPUT"

  publish:
    needs: check
    if: needs.check.outputs.should == 'true'
    runs-on: ubuntu-latest
    container:
      # Real Arch toolchain: makepkg and repo-add only exist here.
      image: archlinux:base-devel
    defaults:
      run:
        # Container steps run with sh (dash) by default: force bash.
        shell: bash
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Install tooling
        run: |
          set -euxo pipefail
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm git curl sudo fakeroot alsa-lib gtk3
          # note: alsa-lib and gtk3 are WaveR's runtime deps; makepkg refuses
          # to build unless every package listed in depends= is installed.

      - name: Check out pacman-repo
        uses: actions/checkout@v7

      - name: Download the release tarball
        run: |
          set -euxo pipefail
          curl -fL --retry 3 \
            -o "WaveR_${VERSION}_x86_64.tar.gz" \
            "https://github.com/FRANORDE/WaveR/releases/download/v${VERSION}/WaveR_${VERSION}_x86_64.tar.gz"

      - name: Build the pacman package
        run: |
          set -euxo pipefail
          # makepkg refuses to run as root: create a builder user with
          # passwordless sudo instead. Build OUTSIDE the workspace
          # (RUNNER_TEMP): stray build files must never reach git.
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/99-builder
          mkdir -p "$RUNNER_TEMP/build" "$RUNNER_TEMP/stage/x86_64"
          # compute the checksum BEFORE moving the file into the build dir
          SUM="$(sha512sum "WaveR_${VERSION}_x86_64.tar.gz" | cut -d' ' -f1)"
          mv "WaveR_${VERSION}_x86_64.tar.gz" "$RUNNER_TEMP/build/"
          # The heredoc is UNQUOTED on purpose: ${VERSION} and ${SUM} must
          # expand while writing the file. makepkg runtime variables are
          # escaped (\$) or bash would expand them (to empty) right here!
          cat > "$RUNNER_TEMP/build/PKGBUILD" <<EOF
          pkgname=wave-r
          pkgver=${VERSION}
          pkgrel=1
          pkgdesc="A simple, cozy local music player"
          arch=('x86_64')
          url="https://github.com/FRANORDE/WaveR"
          license=('MIT')
          depends=('alsa-lib' 'gtk3')
          options=('!strip' '!debug')
          source=("WaveR_${VERSION}_x86_64.tar.gz")
          sha512sums=("${SUM}")

          package() {
              # copy only usr/: a blanket cp -r \${srcdir}/* would also
              # install the source tarball itself at / (cargo-packager wart)
              cp -r "\${srcdir}/usr" "\${pkgdir}"
          }
          EOF
          chown -R builder:builder "$RUNNER_TEMP/build"
          (cd "$RUNNER_TEMP/build" && sudo -H -u builder makepkg -f)
          mv "$RUNNER_TEMP/build"/wave-r-*.pkg.tar.zst "$RUNNER_TEMP/stage/x86_64/"

      - name: Build the repository database
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP/stage/x86_64"
          repo-add wave-r.db.tar.gz wave-r-*.pkg.tar.zst
          # repo-add leaves wave-r.db as a SYMLINK, but GitHub Pages does
          # not serve symlinks: replace it with a real copy (pacman fetches
          # <repo>.db, not <repo>.db.tar.gz).
          rm -f wave-r.db
          cp wave-r.db.tar.gz wave-r.db

      - name: Write the landing page and version marker
        run: |
          set -euo pipefail
          # Quoted heredoc: no expansion, safe for HTML.
          cat > "$RUNNER_TEMP/stage/index.html" <<'EOF'
          <!doctype html>
          <html lang="en">
            <head><meta charset="utf-8"><title>WaveR pacman repository</title></head>
            <body>
              <h1>WaveR pacman repository</h1>
              <p>Installation instructions:
                 <a href="https://github.com/FRANORDE/pacman-repo#readme">github.com/FRANORDE/pacman-repo</a></p>
            </body>
          </html>
          EOF
          # version marker consumed by the scheduled check
          echo "$VERSION" > "$RUNNER_TEMP/stage/latest"

      - name: Publish to gh-pages
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE"
          # checkout marks the repo safe only in its own temporary HOME,
          # which is gone by now; container steps run as root on a
          # runner-owned workspace, so git refuses the repository
          # (safe.directory check) until we mark it safe with OUR config
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Rebuild gh-pages from scratch every publish: a fresh orphan
          # branch, force-pushed, replaces whatever was there (latest-only
          # design).
          git checkout --orphan gh-pages
          # -f is required: on an orphan branch every index entry counts
          # as "staged changes" (HEAD does not exist yet)
          git rm -rfq .
          cp -r "$RUNNER_TEMP/stage/"* .
          # explicit paths (never git add -A: the workspace may hold
          # leftover build files that must not reach the repository)
          git add index.html latest x86_64
          git commit -m "Publish wave-r ${VERSION} to the pacman repository"
          git push --force origin gh-pages

# Builds the WaveR pacman package with a real Arch toolchain and publishes
# a self-hosted pacman repository on the gh-pages branch.
#
# Run manually after publishing a WaveR release:
#   gh workflow run pacman-repo.yml -f version=2.0.0
# The tarball is fetched from the PUBLISHED GitHub release (draft assets
# are not reachable: curl gets a 404 without authentication).
#
# What lands on gh-pages (Pages URL = https://franorde.github.io/pacman-repo/):
#   x86_64/wave-r.db                               database (pacman fetches <repo>.db)
#   x86_64/wave-r.db.tar.gz                        same database, name kept by repo-add
#   x86_64/wave-r-<ver>-<rel>-x86_64.pkg.tar.zst   the package
#   index.html                                     tiny landing page (root would 404)
#
# Design: the repository contains ONLY the latest release; every run
# rebuilds the database from scratch (no state carried over). Older
# versions stay available as WaveR release assets.

name: pacman-repo

on:
  workflow_dispatch:
    inputs:
      version:
        description: WaveR version to publish (with or without leading "v")
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: pacman-repo
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    container:
      # Real Arch toolchain: makepkg and repo-add only exist here.
      image: archlinux:base-devel
    defaults:
      run:
        # Container steps run with sh (dash) by default: force bash.
        shell: bash
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Install tooling and normalize the version
        run: |
          set -euxo pipefail
          VERSION="${VERSION#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm git curl sudo fakeroot alsa-lib gtk3
          # note: alsa-lib and gtk3 are WaveR's runtime deps; makepkg refuses
          # to build unless every package listed in depends= is installed.

      - name: Check out pacman-repo
        uses: actions/checkout@v7

      - name: Download the release tarball
        run: |
          set -euxo pipefail
          curl -fL --retry 3 \
            -o "WaveR_${VERSION}_x86_64.tar.gz" \
            "https://github.com/FRANORDE/WaveR/releases/download/v${VERSION}/WaveR_${VERSION}_x86_64.tar.gz"

      - name: Build the pacman package
        run: |
          set -euxo pipefail
          # makepkg refuses to run as root: create a builder user with
          # passwordless sudo instead.
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/99-builder
          mkdir -p work "$RUNNER_TEMP/stage/x86_64"
          SUM="$(sha512sum "WaveR_${VERSION}_x86_64.tar.gz" | cut -d' ' -f1)"
          mv "WaveR_${VERSION}_x86_64.tar.gz" work/
          # The heredoc is UNQUOTED on purpose: ${VERSION} and ${SUM} must
          # expand while writing the file. makepkg runtime variables are
          # escaped (\$) or bash would expand them (to empty) right here!
          cat > work/PKGBUILD <<EOF
          pkgname=wave-r
          pkgver=${VERSION}
          pkgrel=1
          pkgdesc="A simple, cozy local music player"
          arch=('x86_64')
          url="https://github.com/FRANORDE/WaveR"
          license=('MIT')
          depends=('alsa-lib' 'gtk3')
          options=('!strip')
          source=("WaveR_${VERSION}_x86_64.tar.gz")
          sha512sums=("${SUM}")

          package() {
              # copy only usr/: a blanket cp -r \${srcdir}/* would also
              # install the source tarball itself at / (cargo-packager wart)
              cp -r "\${srcdir}/usr" "\${pkgdir}"
          }
          EOF
          chown -R builder:builder work
          (cd work && sudo -H -u builder makepkg -f)
          mv work/wave-r-*.pkg.tar.zst "$RUNNER_TEMP/stage/x86_64/"

      - name: Build the repository database
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP/stage/x86_64"
          repo-add wave-r.db.tar.gz wave-r-*.pkg.tar.zst
          # repo-add leaves wave-r.db as a SYMLINK, but GitHub Pages does
          # not serve symlinks: replace it with a real copy (pacman fetches
          # <repo>.db, not <repo>.db.tar.gz).
          rm -f wave-r.db
          cp wave-r.db.tar.gz wave-r.db

      - name: Write the landing page
        run: |
          set -euo pipefail
          # Quoted heredoc: no expansion, safe for HTML.
          cat > "$RUNNER_TEMP/stage/index.html" <<'EOF'
          <!doctype html>
          <html lang="en">
            <head><meta charset="utf-8"><title>WaveR pacman repository</title></head>
            <body>
              <h1>WaveR pacman repository</h1>
              <p>Installation instructions:
                 <a href="https://github.com/FRANORDE/pacman-repo#readme">github.com/FRANORDE/pacman-repo</a></p>
            </body>
          </html>
          EOF

      - name: Publish to gh-pages
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE"
          # checkout marks the repo safe only in its own temporary HOME,
          # which is gone by now; container steps run as root on a
          # runner-owned workspace, so git refuses the repository
          # (safe.directory check) until we mark it safe with OUR config
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Rebuild gh-pages from scratch every run: a fresh orphan branch,
          # force-pushed, replaces whatever was there (latest-only design).
          git checkout --orphan gh-pages
          git rm -rq .
          cp -r "$RUNNER_TEMP/stage/"* .
          git add index.html x86_64
          git commit -m "Publish wave-r ${VERSION} to the pacman repository"
          git push --force origin gh-pages
